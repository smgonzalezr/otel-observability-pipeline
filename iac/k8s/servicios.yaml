# Despliegue de los dos microservicios en GKE.
# Apuntan al Collector por el Service del namespace observability.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: service-a }
  template:
    metadata:
      labels: { app: service-a }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      containers:
        - name: service-a
          image: REGISTRO/service-a:1.0.0
          ports:
            - { containerPort: 8001, name: http }
            - { containerPort: 9464, name: metrics }
          env:
            - { name: OTEL_ENABLED, value: "true" }
            - { name: OTEL_SERVICE_NAME, value: "service-a" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc:4317" }
            - { name: SERVICE_B_URL, value: "http://service-b.demo.svc:8002" }
            - { name: DEPLOYMENT_ENV, value: "production" }
            - { name: CLOUD_PROVIDER, value: "gcp" }
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef: { name: entorno, key: gcp_project_id }
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
  namespace: demo
spec:
  selector: { app: service-a }
  ports:
    - { name: http, port: 8001, targetPort: 8001 }
    - { name: metrics, port: 9464, targetPort: 9464 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: service-b }
  template:
    metadata:
      labels: { app: service-b }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      containers:
        - name: service-b
          image: REGISTRO/service-b:1.0.0
          ports:
            - { containerPort: 8002, name: http }
            - { containerPort: 9464, name: metrics }
          env:
            - { name: OTEL_ENABLED, value: "true" }
            - { name: OTEL_SERVICE_NAME, value: "service-b" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc:4317" }
            - { name: DEPLOYMENT_ENV, value: "production" }
            - { name: CLOUD_PROVIDER, value: "gcp" }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8002 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
  namespace: demo
spec:
  selector: { app: service-b }
  ports:
    - { name: http, port: 8002, targetPort: 8002 }
    - { name: metrics, port: 9464, targetPort: 9464 }
