apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      # Desde una traza se salta a sus logs filtrando por trace_id.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
        filterByTraceID: true
        customQuery: false
      tracesToMetrics:
        datasourceUid: prometheus
        queries:
          - name: Tasa de peticiones
            query: sum(rate(otel_demo_calls_total{service_name="$${__span.tags['service.name']}"}[5m]))

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Convierte el campo trace_id de cada log JSON en un enlace a Jaeger.
      # Este es el pivote que pide la Fase 3.
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":\s*"([a-f0-9]{32})"'
          url: '$${__value.raw}'
          datasourceUid: jaeger
          urlDisplayLabel: Ver traza
