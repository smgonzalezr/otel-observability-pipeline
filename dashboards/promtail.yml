server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: contenedores
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      # Los servicios escriben JSON, asi que trace_id queda como etiqueta
      # y Grafana puede filtrar por el.
      - json:
          expressions:
            trace_id: trace_id
            span_id: span_id
            severity: severity
            servicio: '"service.name"'
      - labels:
          severity:
          servicio:
