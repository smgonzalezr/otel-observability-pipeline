global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Metricas que el Collector traduce de OTLP a formato Prometheus.
  - job_name: otel-collector-export
    static_configs:
      - targets: ['otel-collector:8889']

  # Metricas internas del propio Collector. Alimentan el panel 6.
  - job_name: otel-collector-self
    static_configs:
      - targets: ['otel-collector:8888']

  # Endpoint que expone cada servicio con el PrometheusMetricReader del SDK.
  - job_name: servicios
    static_configs:
      - targets: ['service-a:9464', 'service-b:9464']
