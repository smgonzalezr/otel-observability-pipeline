# =============================================================================
# OpenTelemetry Collector para AWS (ECS Fargate)
# Distribucion: otel/opentelemetry-collector-contrib
#
# Es la misma estructura que la de GCP. Solo cambian los exporters, que es
# justo el punto que hace portable el diseno: el codigo de los servicios y
# los receivers y processors son identicos en las dos nubes.
#
#   trazas   -> AWS X-Ray, Tempo y Jaeger
#   metricas -> endpoint Prometheus y CloudWatch por EMF
#   logs     -> CloudWatch Logs
# =============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 16
      http:
        endpoint: 0.0.0.0:4318

  prometheus/self:
    config:
      scrape_configs:
        - job_name: otel-collector-self
          scrape_interval: 15s
          static_configs:
            - targets: [localhost:8888]

  # Metricas de la tarea de ECS. Equivale a kubeletstats en GKE.
  awsecscontainermetrics:
    collection_interval: 30s

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  resource:
    attributes:
      - key: cloud.provider
        value: aws
        action: upsert
      - key: cloud.platform
        value: aws_ecs
        action: upsert
      - key: deployment.environment.name
        value: production
        action: upsert
      - key: telemetry.pipeline
        value: ecs-collector
        action: upsert

  resourcedetection:
    detectors: [env, ecs, ec2]
    timeout: 5s
    override: false

  # X-Ray exige que el id de la traza empiece con la marca de tiempo.
  # Este procesador hace esa conversion sin tocar el SDK.
  resource/xray:
    attributes:
      - key: aws.local.service
        from_attribute: service.name
        action: insert

  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s]
    dimensions:
      - name: http.request.method
      - name: http.route
      - name: http.response.status_code
      - name: service.name

exporters:
  # --- trazas ---
  awsxray:
    region: ${env:AWS_REGION}
    index_all_attributes: false
    indexed_attributes:
      - ecommerce.order.id
      - ecommerce.checkout.step
      - ecommerce.customer.tier

  # Tempo y Jaeger reciben OTLP nativo. Cambiar de uno a otro es cambiar
  # el endpoint, nada mas.
  otlp/tempo:
    endpoint: tempo.observability.svc:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 2000
    retry_on_failure:
      enabled: true
      max_elapsed_time: 120s

  otlp/jaeger:
    endpoint: jaeger-collector.observability.svc:4317
    tls:
      insecure: true

  # --- metricas ---
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: otel_demo
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: true

  awsemf:
    region: ${env:AWS_REGION}
    namespace: OtelDemo/ECS
    log_group_name: /aws/ecs/otel-demo
    dimension_rollup_option: NoDimensionRollup
    metric_declarations:
      - dimensions: [[service.name, http.route]]
        metric_name_selectors:
          - "duration.*"
          - "calls.*"

  # --- logs ---
  awscloudwatchlogs:
    region: ${env:AWS_REGION}
    log_group_name: /aws/ecs/otel-demo/app
    log_stream_name: from-collector
    sending_queue:
      enabled: true

  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, resource/xray, batch]
      exporters: [awsxray, otlp/tempo, otlp/jaeger, spanmetrics]

    metrics:
      receivers: [otlp, prometheus/self, awsecscontainermetrics, spanmetrics]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [prometheus, awsemf]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [awscloudwatchlogs]

  telemetry:
    logs:
      level: info
      encoding: json
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
